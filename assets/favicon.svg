<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Starship Operations: a small ship climbing past a star, on deep space -->
  <rect width="64" height="64" rx="14" fill="#0a1430"/>
  <circle cx="14" cy="15" r="1.6" fill="#90caf9"/>
  <circle cx="50" cy="12" r="1.2" fill="#e0f7fa"/>
  <circle cx="12" cy="48" r="1" fill="#90caf9"/>
  <g transform="rotate(45 32 32)">
    <!-- exhaust -->
    <path d="M28 46 L32 60 L36 46 Z" fill="#ffb74d"/>
    <path d="M30 46 L32 54 L34 46 Z" fill="#fff3e0"/>
    <!-- fins -->
    <path d="M24 34 L16 46 L26 44 Z" fill="#0072ff"/>
    <path d="M40 34 L48 46 L38 44 Z" fill="#0072ff"/>
    <!-- hull -->
    <path d="M32 6 C40 14 41 30 39 46 L25 46 C23 30 24 14 32 6 Z" fill="#cfe8ff"/>
    <!-- cockpit -->
    <circle cx="32" cy="22" r="4.5" fill="#00c6ff" stroke="#0a1430" stroke-width="1.5"/>
  </g>
</svg>
