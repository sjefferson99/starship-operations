<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
    <linearGradient id="engineGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#f6ad55;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#fc8181;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#fc8181;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="cockpitGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76e4f7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Engine exhaust plume -->
  <ellipse cx="368" cy="100" rx="38" ry="14" fill="url(#engineGlow)"/>
  <ellipse cx="375" cy="100" rx="24" ry="8" fill="#f6ad55" opacity="0.35"/>

  <!-- Upper delta wing -->
  <polygon points="175,82 295,82 320,42 200,42" fill="url(#wingGrad)" stroke="#1a202c" stroke-width="1.5"/>
  <!-- Wing surface detail lines -->
  <line x1="220" y1="82" x2="233" y2="54" stroke="#3a4556" stroke-width="1"/>
  <line x1="260" y1="82" x2="278" y2="54" stroke="#3a4556" stroke-width="1"/>

  <!-- Lower delta wing -->
  <polygon points="175,118 295,118 320,158 200,158" fill="url(#wingGrad)" stroke="#1a202c" stroke-width="1.5"/>
  <!-- Wing surface detail lines -->
  <line x1="220" y1="118" x2="233" y2="146" stroke="#3a4556" stroke-width="1"/>
  <line x1="260" y1="118" x2="278" y2="146" stroke="#3a4556" stroke-width="1"/>

  <!-- Main hull body -->
  <polygon points="70,88 320,84 335,100 320,116 70,112 52,100" fill="url(#hullGrad)" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Hull panel seams -->
  <line x1="130" y1="84" x2="130" y2="116" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="175" y1="84" x2="175" y2="116" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="240" y1="84" x2="240" y2="116" stroke="#1a202c" stroke-width="1.5"/>
  <line x1="295" y1="84" x2="295" y2="116" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Crew module / raised dorsal section -->
  <rect x="85" y="74" width="145" height="22" rx="4" fill="#3a4556" stroke="#1a202c" stroke-width="1"/>
  <line x1="130" y1="74" x2="130" y2="96" stroke="#1a202c" stroke-width="1"/>
  <line x1="175" y1="74" x2="175" y2="96" stroke="#1a202c" stroke-width="1"/>

  <!-- Cockpit nose cone -->
  <polygon points="52,100 70,88 70,112" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
  <!-- Cockpit taper -->
  <polygon points="28,100 52,94 52,106" fill="#2d3748" stroke="#1a202c" stroke-width="1"/>

  <!-- Cockpit windows -->
  <polygon points="35,99 63,91 63,99" fill="url(#cockpitGlass)" opacity="0.85"/>
  <polygon points="35,101 63,101 63,109" fill="url(#cockpitGlass)" opacity="0.45"/>

  <!-- Cargo bay door (main mid section) -->
  <rect x="135" y="87" width="100" height="26" rx="2" fill="#323e52" stroke="#1a202c" stroke-width="1"/>
  <line x1="185" y1="87" x2="185" y2="113" stroke="#1a202c" stroke-width="1"/>
  <!-- Door bolts -->
  <circle cx="142" cy="91" r="2" fill="#4a5568"/>
  <circle cx="142" cy="109" r="2" fill="#4a5568"/>
  <circle cx="228" cy="91" r="2" fill="#4a5568"/>
  <circle cx="228" cy="109" r="2" fill="#4a5568"/>

  <!-- Engine nacelle -->
  <rect x="318" y="86" width="42" height="28" rx="7" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <!-- Engine detail ring -->
  <ellipse cx="340" cy="100" rx="4" ry="14" fill="#5a6478"/>
  <!-- Engine bell -->
  <ellipse cx="360" cy="100" rx="5" ry="13" fill="#718096"/>
  <ellipse cx="361" cy="100" rx="4" ry="10" fill="#f6ad55" opacity="0.7" filter="url(#glow)"/>

  <!-- Wear patches / scorch marks -->
  <rect x="88" y="85" width="18" height="9" fill="#8B4513" opacity="0.3" rx="2"/>
  <ellipse cx="210" cy="114" rx="9" ry="3" fill="#8B4513" opacity="0.2"/>
  <rect x="248" y="87" width="12" height="7" fill="#8B4513" opacity="0.25" rx="1"/>
  <!-- Patch plates (repair welds) -->
  <rect x="96" y="98" width="20" height="8" fill="#3d5068" stroke="#2d3748" stroke-width="0.5" rx="1"/>
  <rect x="270" y="88" width="16" height="6" fill="#3d5068" stroke="#2d3748" stroke-width="0.5" rx="1"/>

  <!-- Registration text on hull -->
  <text x="192" y="104" font-family="monospace" font-size="8" fill="#90cdf4" text-anchor="middle" letter-spacing="2" opacity="0.9">PDR-4471-K</text>

  <!-- Navigation / status lights -->
  <circle cx="28" cy="100" r="3.5" fill="#4fc3f7" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Wing tip lights -->
  <circle cx="317" cy="43" r="3" fill="#fc8181" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="317" cy="157" r="3" fill="#48bb78" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Ship name on dorsal module -->
  <text x="148" y="88" font-family="monospace" font-size="6" fill="#cbd5e0" text-anchor="middle" letter-spacing="1" opacity="0.7">STRAY LIGHT</text>
</svg>
